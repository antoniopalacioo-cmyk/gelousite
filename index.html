<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gelou — Voltamos Já</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --navy: #0D2240;
    --blue: #1565C8;
    --sky: #2196F3;
    --ice: #E3F2FD;
    --amber: #FFB300;
    --bg: #F5F8FF;
    --white: #FFFFFF;
    --text: #1A2733;
    --muted: #607080;
    --border: #DDE8F5;
  }

  body {
    font-family: 'Nunito', -apple-system, BlinkMacSystemFont, sans-serif;
    background: linear-gradient(160deg, var(--navy) 0%, var(--blue) 55%, var(--sky) 100%);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }

  .card {
    background: var(--white);
    border-radius: 24px;
    max-width: 440px;
    width: 100%;
    padding: 40px 32px;
    text-align: center;
    box-shadow: 0 20px 60px rgba(13,34,64,0.35);
  }

  .icon-logo {
    width: 120px;
    max-width: 60%;
    height: auto;
    margin-bottom: 16px;
  }

  h1 {
    color: var(--navy);
    font-size: 24px;
    margin-bottom: 12px;
  }

  p {
    color: var(--muted);
    font-size: 16px;
    line-height: 1.6;
    margin-bottom: 8px;
  }

  .badge {
    display: inline-block;
    background: var(--ice);
    color: var(--blue);
    font-weight: 700;
    font-size: 14px;
    padding: 8px 18px;
    border-radius: 999px;
    margin-top: 20px;
    border: 1px solid var(--border);
  }

  .amber-line {
    height: 4px;
    width: 56px;
    background: var(--amber);
    border-radius: 4px;
    margin: 20px auto;
  }
</style>
</head>
